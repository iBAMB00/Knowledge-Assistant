services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-knowledge_assistant}
      POSTGRES_USER: ${POSTGRES_USER:-knowledge_assistant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-knowledge_assistant_dev}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-knowledge_assistant} -d ${POSTGRES_DB:-knowledge_assistant}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage


  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-knowledge_assistant}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-knowledge_assistant_dev_secret}
    ports:
      - "127.0.0.1:19000:9000"
      - "127.0.0.1:19001:9001"
    volumes:
      - minio_data:/data

  api:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-knowledge_assistant}:${POSTGRES_PASSWORD:-knowledge_assistant_dev}@postgres:5432/${POSTGRES_DB:-knowledge_assistant}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      QDRANT_URL: http://qdrant:6333
      STORAGE_BACKEND: ${DOCKER_STORAGE_BACKEND:-local}
      LOCAL_STORAGE_DIR: /app/uploads
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-knowledge_assistant}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-knowledge_assistant_dev_secret}
      MINIO_BUCKET: ${MINIO_BUCKET:-knowledge-assistant}
      MINIO_SECURE: "False"
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 10

  worker:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-knowledge_assistant}:${POSTGRES_PASSWORD:-knowledge_assistant_dev}@postgres:5432/${POSTGRES_DB:-knowledge_assistant}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      QDRANT_URL: http://qdrant:6333
      STORAGE_BACKEND: ${DOCKER_STORAGE_BACKEND:-local}
      LOCAL_STORAGE_DIR: /app/uploads
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-knowledge_assistant}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-knowledge_assistant_dev_secret}
      MINIO_BUCKET: ${MINIO_BUCKET:-knowledge-assistant}
      MINIO_SECURE: "False"
    command: celery -A app.core.celery_app:celery_app worker --loglevel=INFO --concurrency=2
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      minio:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  uploads_data:
  minio_data:
